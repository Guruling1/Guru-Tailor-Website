<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Guru Men's Wear</title>
    
    <!-- Google Fonts & Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=20260929_01">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #f8fafc;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
        }

        .auth-header {
            background: #ffffff;
            border-bottom: 3px solid #ff7346;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .auth-container {
            display: flex;
            flex: 1;
            min-height: calc(100vh - 65px);
        }

        /* Left Side: Shop Visiting Card (Enlarged) */
        .auth-left {
            width: 58%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 24px;
            border-right: 1px solid var(--border-color);
        }

        .card-preview-wrap {
            max-width: 680px;
            width: 100%;
            text-align: center;
        }

        .card-preview-wrap img {
            width: 100%;
            height: auto;
            max-height: 520px;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.16);
            border: 1px solid #e2e8f0;
            transition: transform 0.3s ease;
        }

        .card-preview-wrap img:hover {
            transform: scale(1.02);
        }

        .card-caption {
            margin-top: 18px;
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 500;
        }

        .card-caption strong {
            color: #ff7346;
        }

        /* Right Side: Inputs & Form Box */
        .auth-right {
            width: 42%;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .form-box {
            width: 100%;
            max-width: 440px;
            padding: 34px 30px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(11, 19, 41, 0.08);
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .form-box h2 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.85rem;
            color: #0b1329;
            margin-bottom: 6px;
        }

        .sub-text {
            margin-bottom: 20px;
            font-size: 0.92rem;
            color: #64748b;
        }

        .auth-input-group {
            text-align: left;
            margin-bottom: 14px;
        }

        .auth-input-group label {
            display: block;
            font-size: 0.84rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 5px;
        }

        .form-box input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.92rem;
            font-family: inherit;
            transition: all 0.2s ease;
            background-color: #ffffff;
        }

        .form-box input:focus {
            outline: none;
            border-color: #ff7346;
            box-shadow: 0 0 0 3px rgba(255, 115, 70, 0.2);
        }

        /* Light Orange Sign Up Button (#ff7346) */
        .btn-signup {
            width: 100%;
            padding: 13px;
            background: #ff7346 !important;
            background: linear-gradient(135deg, #ff8558 0%, #ff7346 100%) !important;
            color: #ffffff !important;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            box-shadow: 0 4px 14px rgba(255, 115, 70, 0.35);
            transition: all 0.25s ease;
        }

        .btn-signup:hover {
            background: linear-gradient(135deg, #ff7346 0%, #e65c2e 100%) !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 115, 70, 0.45);
        }

        .bottom-text {
            margin-top: 16px;
            font-size: 0.9rem;
            color: #475569;
        }

        .bottom-text a {
            color: #ff7346;
            font-weight: 700;
            text-decoration: none;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            color: #64748b;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link:hover {
            color: #0b1329;
        }

        /* Responsive Breakpoint */
        @media (max-width: 900px) {
            .auth-container {
                flex-direction: column;
            }
            .auth-left, .auth-right {
                width: 100%;
            }
            .auth-left {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 24px 20px;
            }
            .card-preview-wrap {
                max-width: 380px;
            }
            .auth-right {
                padding: 30px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <header class="auth-header">
        <a href="index.html" class="brand-logo" style="text-decoration: none;">
            <img src="logo gmw.jpg" alt="Guru Men's Wear" style="height: 44px; border-radius: 6px;">
            <div class="brand-text">
                <span class="brand-title" style="font-size: 1.15rem; color: #0b1329;">Guru Men's Wear</span>
                <span class="brand-tagline" style="font-size: 0.7rem; color: #ff7043;">Perfect Stitch, Perfect Fit</span>
            </div>
        </a>
        <a href="index.html" class="back-link"><i class="fa-solid fa-house"></i> Home</a>
    </header>

    <!-- AUTH CONTAINER (LEFT: SHOP CARD | RIGHT: FORM) -->
    <div class="auth-container">
        
        <!-- Left: Shop Visiting Card -->
        <div class="auth-left">
            <div class="card-preview-wrap">
                <img src="guru mens wear visiting card.jpg" alt="Guru Men's Wear Official Shop Visiting Card">
                <p class="card-caption">
                    Official Visiting Card &bull; <strong>Jamadar Complex, Noubad, Bidar - 585401</strong>
                </p>
                <div style="margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #64748b; background: #fff3e0; padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255, 112, 67, 0.25);">
                    <i class="fa-solid fa-scissors" style="color: #ff7043;"></i>
                    <span>Master Fabric Cutting & Bespoke Tailoring</span>
                </div>
            </div>
        </div>

        <!-- Right: Inputs & Sign Up Form -->
        <div class="auth-right">
            <div class="form-box">
                <h2>Create Account</h2>
                <p class="sub-text">Join Guru Men's Wear for tailored convenience</p>

                <form onsubmit="event.preventDefault(); alert('Account registered successfully! Redirecting to orders...'); window.location.href='order.html';">
                    <div class="auth-input-group">
                        <label for="signupName"><i class="fa-solid fa-user" style="color: #ff7043;"></i> Full Name</label>
                        <input type="text" id="signupName" placeholder="Enter your full name" required>
                    </div>

                    <div class="auth-input-group">
                        <label for="signupPhone"><i class="fa-solid fa-phone" style="color: #ff7043;"></i> Mobile Number</label>
                        <input type="tel" id="signupPhone" placeholder="Enter 10-digit mobile number" required>
                    </div>

                    <div class="auth-input-group">
                        <label for="signupEmail"><i class="fa-solid fa-envelope" style="color: #ff7043;"></i> Email Address</label>
                        <input type="email" id="signupEmail" placeholder="Enter your email" required>
                    </div>

                    <div class="auth-input-group">
                        <label for="signupPassword"><i class="fa-solid fa-lock" style="color: #ff7043;"></i> Set Password</label>
                        <input type="password" id="signupPassword" placeholder="Create a secure password" required>
                    </div>

                    <button type="submit" class="btn-signup">
                        <i class="fa-solid fa-user-plus"></i> Sign Up
                    </button>
                </form>

                <p class="bottom-text">
                    Already have an account?
                    <a href="signin.html">Sign In</a>
                </p>

                <a href="index.html" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i> Return to Homepage
                </a>
            </div>
        </div>

    </div>

</body>
</html>
