<!DOCTYPE html>
<html>
<head>
    <title>Stitching Order</title>
    <link rel="stylesheet" href="order.css">
</head>
<body>

    <div class="container">

        <h1 style="color:orangered">Customize Your Stitching Order</h1>

        <!-- ITEM CARD -->
        <div class="item-card">
            <div class="item-header">
                <span class="item-name">Shirt</span>
                <span class="item-price">₹350</span>
            </div>

            <div class="item-controls">
                <button class="minus">-</button>
                <input type="number" value="0" min="0">
                <button class="plus">+</button>
                <span class="item-total">₹0</span>
            </div>
        </div>

        <div class="item-card">
            <div class="item-header">
                <span class="item-name">Pant</span>
                <span class="item-price">₹500</span>
            </div>

            <div class="item-controls">
                <button class="minus">-</button>
                <input type="number" value="0" min="0">
                <button class="plus">+</button>
                <span class="item-total">₹0</span>
            </div>
        </div>

        <div class="item-card">
            <div class="item-header">
                <span class="item-name">Suit</span>
                <span class="item-price">₹1200</span>
            </div>

            <div class="item-controls">
                <button class="minus">-</button>
                <input type="number" value="0" min="0">
                <button class="plus">+</button>
                <span class="item-total">₹0</span>
            </div>
        </div>

        <div class="item-card">
            <div class="item-header">
                <span class="item-name">Blazer</span>
                <span class="item-price">₹1450</span>
            </div>

            <div class="item-controls">
                <button class="minus">-</button>
                <input type="number" value="0" min="0">
                <button class="plus">+</button>
                <span class="item-total">₹0</span>
            </div>
        </div>

        <div class="item-card">
            <div class="item-header">
                <span class="item-name">Long Kurta</span>
                <span class="item-price">₹580</span>
            </div>

            <div class="item-controls">
                <button class="minus">-</button>
                <input type="number" value="0" min="0">
                <button class="plus">+</button>
                <span class="item-total">₹0</span>
            </div>
        </div>

        <div class="item-card">
            <div class="item-header">
                <span class="item-name">Short Kurta</span>
                <span class="item-price">₹550</span>
            </div>

            <div class="item-controls">
                <button class="minus">-</button>
                <input type="number" value="0" min="0">
                <button class="plus">+</button>
                <span class="item-total">₹0</span>
            </div>
        </div>

        <div class="item-card">
            <div class="item-header">
                <span class="item-name">Safari</span>
                <span class="item-price">₹900</span>
            </div>

            <div class="item-controls">
                <button class="minus">-</button>
                <input type="number" value="0" min="0">
                <button class="plus">+</button>
                <span class="item-total">₹0</span>
            </div>
        </div>

        <!-- TOTAL SECTION -->
        <div class="total-section">
            <h2 style="color:black">Total Amount: ₹0</h2>
            <button class="pay-btn">PAY NOW</button>
        </div>

        <!-- CUSTOMER DETAILS (Hidden for now) -->
        <div class="details-form">
            <h3>Enter Your Details</h3>
            <input type="text" placeholder="Enter Name">
            <input type="tel" placeholder="Enter Phone Number">
            <button class="confirm-btn">Confirm & Pay</button>
        </div>

        <!-- SUCCESS MESSAGE -->
        <div class="success-message">
            <h2>Order Placed Successfully!</h2>
        </div>

    </div>

</body>
</html>
