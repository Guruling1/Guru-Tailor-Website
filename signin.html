<!DOCTYPE html>
<html>
<head>
    <title>Sign In - Guru Men's Wear</title>
    <link rel="stylesheet" href="signin.css">
</head>
<body>

<div class="container">

   
    <div class="left">
        <img src="guru mens wear visiting card.jpg" alt="Guru Men's Wear">
    </div>

    
    <div class="right">
        <div class="form-box">
            <h2>Welcome Back</h2>
            <p class="sub-text">Sign in to continue</p>

            <form>
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>

            <p class="bottom-text">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>
        </div>
    </div>

</div>

</body>
</html>
